<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kico Professional Music Services - Gallery</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="img/logo.png" alt="Novatech Logo" class="logo" />
        <span class="logo-text">Professional Music Services</span>
      </div>
      <ul class="nav-links">
        <li><a href="index.html" class="active-link">Home</a></li>
        <li><a href="galeria.html" class="active-link">Gallery</a></li>
        <li><a href="servicios.html">Services</a></li>
        <li><a href="contacto.html">Contact Us</a></li>
        <li id="loginLink"><a href="login.html">Login</a></li>
        <li>
          <a href="carrito.html" class="carrito">
            <img src="img/carrito.png" alt="Cart" class="icono-carrito" />
            <span class="contador">0</span>
          </a>
        </li>
        <li id="adminMenu" style="display:none;">
          <a href="admin-productos.html">Manage Products</a>
        </li>
      </ul>
    </nav>
  </header>

  <section class="gallery-section">
    <h2>Gallery</h2>
    <p class="gallery-subtitle">
      Moments, performances, and musical projects
    </p>

    <div class="gallery-grid">
      <img src="img/Galeria/galeria0.jpg" alt="Live moments on stage" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria1.jpg" alt="Kico performing live" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria2.jpg" alt="Live show with band" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria3.jpeg" alt="Keyboard and music in action" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria4.jpg" alt="Night performance on stage" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria5.jpg" alt="Live music during an event" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria6.jpg" alt="Kico accompanying a musical event" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria7.jpg" alt="Studio work and rehearsals" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria8.jpg" alt="Work team in the studio" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria9.jpg" alt="Rehearsal and musical preparation" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria10.jpg" alt="Sharing the stage with colleagues" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria11.jpg" alt="Live concert atmosphere" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria12.jpeg" alt="Outdoor musical event" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria13.jpg" alt="Group ready for performance" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria14.jpg" alt="Musical group at special event" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria15.jpeg" alt="Full rehearsal with the group" onclick="openLightbox(this)">
      <img src="img/Galeria/galeria16.jpg" alt="Group photo after the show" onclick="openLightbox(this)">
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="">
  </div>

  <!-- Gallery JS (ALWAYS here) -->
  <script src="js/galeria.js"></script>

</body>
</html>
