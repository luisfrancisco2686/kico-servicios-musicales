<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | Kico Professional Music Services</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Header -->
  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="img/logo.png" alt="Kico Logo" class="logo">
        <span class="logo-text">Professional Music Services</span>
      </div>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="galeria.html" class="active-link">Gallery</a></li>
        <li><a href="servicios.html">Services</a></li>
        <li><a href="contacto.html">Contact</a></li>

        <li>
          <a href="carrito.html" class="carrito">
            <img src="img/carrito.png" alt="Cart" class="icono-carrito">
            <span class="contador">0</span>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Main content -->
  <main class="container">
    <h1>🛒 Service Cart</h1>

    <section id="cart-items">
      <!-- Services added dynamically -->
    </section>

    <section id="cart-summary">
      <h2>Order summary</h2>
      <p>Total: <strong><span id="cart-total">To be agreed</span></strong></p>

      <form id="order-form">
        <label for="nombre">Your name</label>
        <input type="text" id="nombre" required>

        <label for="correo">Email address</label>
        <input type="email" id="correo" required>

        <label for="direccion">Address / Notes</label>
        <input type="text" id="direccion" required>

        <label for="pedido">Order details</label>
        <textarea id="pedido" readonly></textarea>

        <button type="submit" class="btn">Send order</button>
      </form>

      <p id="msg"></p>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-info">
      <p>© 2025 Kico – Professional Music Services</p>
      <p>Arrangements | Piano | Transcription | Sound</p>
    </div>
  </footer>

  <!-- ======================
        CART JS
       ====================== -->
  <script>
    const CART_KEY = 'novatech_cart_v1';
    const SERVICES_KEY = 'novatech_services_v1';

    const cartContainer = document.getElementById("cart-items");
    const cartTotal = document.getElementById("cart-total");
    const pedidoTextarea = document.getElementById("pedido");
    const contadorEls = document.querySelectorAll(".contador");

    const cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
    const services = JSON.parse(localStorage.getItem(SERVICES_KEY)) || [];

    // Update header counter
    const totalItems = cart.reduce((acc, item) => acc + item.quantity, 0);
    contadorEls.forEach(el => el.textContent = totalItems);

    if (cart.length === 0) {
      cartContainer.innerHTML = "<p>You have no services in your cart.</p>";
      pedidoTextarea.value = "";
    } else {
      cartContainer.innerHTML = "";
      let pedidoDetalle = "";

      cart.forEach(item => {
        const service = services.find(s => s.id === item.id);
        if (!service) return;

        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
          <p>
            <strong>${service.name}</strong><br>
            Quantity: ${item.quantity}<br>
            Price: To be agreed
          </p>
        `;
        cartContainer.appendChild(div);

        pedidoDetalle += `${service.name} x${item.quantity} - To be agreed\n`;
      });

      pedidoTextarea.value = pedidoDetalle;
    }

    // Send simulation (no backend)
    document.getElementById("order-form").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("msg").textContent =
        "✅ Order sent successfully. We will contact you shortly.";
      
      localStorage.removeItem(CART_KEY);
      setTimeout(() => {
        window.location.reload();
      }, 1500);
    });
  </script>

</body>
</html>
