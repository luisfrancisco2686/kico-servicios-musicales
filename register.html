<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiko Professional Music Services - Register</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="img/logo.png" alt="Novatech Logo" class="logo">
        <span class="logo-text">Professional Music Services</span>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="galeria.html" class="active-link">Gallery</a></li>
        <li><a href="servicios.html">Services</a></li>
        <li><a href="contacto.html">Contact Us</a></li>
        <li id="loginLink"><a href="login.html">Login</a></li>
        <li>
          <a href="carrito.html" class="carrito">
            <img src="img/carrito.png" alt="Cart" class="icono-carrito">
            <span class="contador">0</span>
          </a>
        </li>
        <li id="adminMenu" style="display:none;">
          <a href="admin-productos.html">Manage Products</a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="login-container">
    <div class="login-form">
      <h2>Create Account</h2>
      <form id="registerForm">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="example@email.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimum 5 characters" required minlength="5">

        <button type="submit">Register</button>
      </form>
      <p class="extra">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <footer>

  </footer>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

      // Check if already exists
      const existe = usuarios.find(user => user.email === email);
      if (existe) {
        alert("⚠️ This email is already registered. Try another one.");
        return;
      }

      // Save new user
      usuarios.push({ email, password });
      localStorage.setItem("usuarios", JSON.stringify(usuarios));

      alert("✅ Registration successful. You can now log in.");
      window.location.href = "login.html";
    });
  </script>
    <footer>
    <div class="footer-container">
      <div class="footer-logo">
        <img src="img/logo.png" alt="Kico Professional Music Services">
      </div>
      <div class="footer-info">
        <p>© 2025 Kico – Professional Music Services</p>
        <p>Arrangements | Piano | Transcription | Sound</p>
      </div>
      <div class="footer-social">
        <a href="#"><img src="img/facebook.png" alt="Facebook"></a>
        <a href="#"><img src="img/twitter.png" alt="Twitter"></a>
        <a href="#"><img src="img/youtube.png" alt="YouTube"></a>
        <a href="#"><img src="img/linkedin.png" alt="LinkedIn"></a>
      </div>
    </div>
  </footer>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem("isAdmin") === "true") {
      document.getElementById("adminMenu").style.display = "block";
      document.getElementById("loginLink").style.display = "none";
    }
  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const isAdmin = localStorage.getItem("isAdmin") === "true";
    const loginLink = document.getElementById("loginLink");
    const logoutLink = document.getElementById("logoutLink");
    const adminMenu = document.getElementById("adminMenu");

    if (isAdmin) {
      adminMenu.style.display = "block";
      loginLink.style.display = "none";
      logoutLink.style.display = "block";
    } else {
      adminMenu.style.display = "none";
      loginLink.style.display = "block";
      logoutLink.style.display = "none";
    }

    // Log out
    logoutLink.addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem("isAdmin");
      window.location.href = "index.html"; // redirect to home
    });
  });
</script>
</body>
</html>
