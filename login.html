<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kico Professional Music Services - Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="img/logo.png" alt="Kico Professional Music Services Logo" class="logo">
        <span class="logo-text">Professional Music Services</span>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="galeria.html" class="active-link">Gallery</a></li>
        <li><a href="servicios.html">Services</a></li>
        <li><a href="contacto.html">Contact Us</a></li>
        <li id="loginLink"><a href="login.html">Login</a></li>
        <li>
          <a href="carrito.html" class="carrito">
            <img src="img/carrito.png" alt="Cart" class="icono-carrito">
            <span class="contador">0</span>
          </a>
        </li>
        <li id="adminMenu" style="display:none;">
          <a href="admin-productos.html">Manage Products</a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="login-container">
      <div class="login-form">
        <h2>Log In</h2>
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="example@email.com" required>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="********" required>
        <button id="btnLogin">Sign In</button>
        <div id="errorMsg" class="extra" style="color:red; display:none;">Incorrect email or password</div>
        <div class="extra">
          <p>Don't have an account? <a href="register.html">Sign up here</a></p>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-container">
      <div class="footer-logo">
        <img src="img/logofooter.png" alt="Kico Professional Music Services Logo">
      </div>
      <div class="footer-info">
        <p>© 2025 Kico – Professional Music Services</p>
        <p>Arrangements | Piano | Transcription | Sound</p>
      </div>
      <div class="footer-social">
        <a href="#"><img src="img/facebook.png" alt="Facebook"></a>
        <a href="#"><img src="img/twitter.png" alt="Twitter"></a>
        <a href="#"><img src="img/youtube.png" alt="YouTube"></a>
        <a href="#"><img src="img/linkedin.png" alt="LinkedIn"></a>
      </div>
    </div>
 </footer> 

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const adminEmail = "poligrancolombiano2025@gmail.com";
      const adminPass = "Poli123*";

      const btnLogin = document.getElementById("btnLogin");
      const errorMsg = document.getElementById("errorMsg");

      btnLogin.addEventListener("click", () => {
        const email = document.getElementById("email").value.trim();
        const pass = document.getElementById("password").value.trim();

        if (email === adminEmail && pass === adminPass) {
          localStorage.setItem("isAdmin", "true");
          window.location.href = "index.html";
        } else {
          localStorage.setItem("isAdmin", "false");
          errorMsg.style.display = "block";
        }
      });

      if (localStorage.getItem("isAdmin") === "true") {
        document.getElementById("adminMenu").style.display = "block";
        document.getElementById("loginLink").style.display = "none";
      }
    });
  </script>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const isAdmin = localStorage.getItem("isAdmin") === "true";
    const loginLink = document.getElementById("loginLink");
    const logoutLink = document.getElementById("logoutLink");
    const adminMenu = document.getElementById("adminMenu");

    if (isAdmin) {
      adminMenu.style.display = "block";
      loginLink.style.display = "none";
      logoutLink.style.display = "block";
    } else {
      adminMenu.style.display = "none";
      loginLink.style.display = "block";
      logoutLink.style.display = "none";
    }

    // Log out
    logoutLink.addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem("isAdmin");
      window.location.href = "index.html"; // redirect to home
    });
  });
</script>
</body>
</html>
